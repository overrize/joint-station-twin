id: DEC-NG-001
date: 2026-10-24
decision: >-
  机螺钉组 C（编码器）与 E（端盖）判浮高时，执行器自行反转退出后重拧一次（max 1，on_modes [float]），
  最后只向控制器回一次「完成」或「异常」；复拧仍不合格则按原 on_ng（退回、标记 NG、继续）。
  自攻螺钉组 D（驱动板，PA66）不复拧，滑牙/浮高仍整件停止。复拧完全在执行器侧，机械臂程序不变（保持-等待），
  写在业务流每步的 executor_retry 字段里，状态机轨迹记 EXEC_RETRY。
rejected: >-
  只按原策略标记 NG、不复拧（推荐项，未选）；滑牙也复拧：机螺钉滑牙为螺纹损伤，复拧无效且可能扩大损伤；
  自攻螺钉复拧：PA66 二次攻入会扩孔，夹紧力不可控。
assumptions: >-
  执行器支持反转退出与同参数重拧；反转角度、速度与复拧时长属执行器参数，当前缺失（待执行器供应商），
  孪生里反转时长按「拧入时长 × 已拧入深度比例」演示，不作为节拍依据；复拧的额外时间不计入节拍估算。
invalidation: >-
  执行器不支持反转复拧；客户质量体系不允许自动复拧（要求一次判定）；复拧数据表明浮高多由来料或孔位问题导致，复拧无效。
trigger: 用户提出（演示纠错能力）
confirmed_by: 用户（2026-10-24 选择「加一次自动复拧」：机螺钉 C/E 组浮高时自动反转后重拧一次，D 组不复拧）
status: confirmed
