id: DEC-FEED-001
date: 2026-10-25
decision: >-
  拧紧臂每颗螺钉先到供钉器对应料道的出钉位，批头真空吸取后再去孔位（取代 M3.1b 的吹气送钉）。
  出钉位在每路出钉口末端，螺钉头朝上立在出钉位顶面；取钉确认由批头真空给出（URScript DI4）。
rejected: >-
  吹气送钉（原方案）：供钉器只是摆设，供钉器位置与料道结构不参与运动和干涉；
  供钉器挪到治具旁：要改布局，用户选择保留现布局。
assumptions: >-
  出钉位尺寸、位置、批头真空吸附能力为 demo 占位；每颗多出取钉往返时间，如实计入孪生节拍。
invalidation: 换成吹气式批头或螺钉自动上料到批头的执行器；节拍要求不允许每颗往返。
trigger: 用户提出（2026-10-25：螺钉也要从取钉的地方获取，不然后边设计的内容和结构用不上）
confirmed_by: 用户（2026-10-25 选择「每颗都去供钉器出钉口取」）
status: confirmed
