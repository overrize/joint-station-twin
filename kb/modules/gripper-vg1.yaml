example_data: true
id: GR-VG1
type: gripper
name: 真空吸盘手爪（放件臂用）
principle: vacuum
payload_kg: 1.0
cycle_s: 0.3            # 吸 / 放各一次的建立时间（demo 占位）
interfaces: [tier0]
# 外形包络：沿工具轴从 TCP（吸盘面）向上，单位 mm；TCP 偏移 = 最上一段的上端。demo 占位，非供应商数据
envelope:
  source: demo_placeholder
  segments:
    - {name: cup, z: [0.0, 20.0], r: 6.0}      # Ø12：驱动板与支架的环面只有 13.5 mm 宽
    - {name: stem, z: [20.0, 70.0], r: 5.0}
    - {name: body, z: [70.0, 120.0], r: 22.0}
io:
  source: demo_placeholder
  signals:
    - {name: vacuum_on, dir: in, type: bool, desc: 开真空}
    - {name: vacuum_ok, dir: out, type: bool, desc: 真空度达到，吸住}
